# Free-tier keepalive (decision 2026-08-30: stay on Supabase Free until traffic
# justifies Pro). Free projects PAUSE after 7 days without API activity — a
# paused project takes the live app down. This pings the public REST and Auth
# endpoints daily with the public anon key (already shipped in the app binary,
# not a secret) so the project never counts as idle.
name: keepalive
on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC (12:47 ACST)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: REST ping (public categories table)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${ANON}" -H "Authorization: Bearer ${ANON}" \
            "https://lpajdhhgfzsdlehqndni.supabase.co/rest/v1/categories?select=id&limit=1")
          echo "rest=$code"; test "$code" = "200"
        env:
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwYWpkaGhnZnpzZGxlaHFuZG5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzcwNDMsImV4cCI6MjEwMjMxMzA0M30.H41QTu8qGFRkMbmLLVtPnDbwZiiOSbNqYjbp2XRsPy8
      - name: Auth health ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: ${ANON}" \
            "https://lpajdhhgfzsdlehqndni.supabase.co/auth/v1/health")
          echo "auth=$code"; test "$code" = "200"
        env:
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwYWpkaGhnZnpzZGxlaHFuZG5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzcwNDMsImV4cCI6MjEwMjMxMzA0M30.H41QTu8qGFRkMbmLLVtPnDbwZiiOSbNqYjbp2XRsPy8
