name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: i18n completeness (KO/EN/ZH)
        run: node scripts/check-i18n.js
      # Critical advisories block; high-level ones surface as warnings —
      # highs in the Expo/metro toolchain are transitive and unfixable here.
      - name: Dependency audit (critical gate)
        run: npm audit --audit-level=critical
      - name: Dependency audit report (high, non-blocking)
        run: npm audit --audit-level=high || echo "::warning::high-severity advisories present, see log"
